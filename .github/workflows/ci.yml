name: CI — build & push

# Только сборка и пуш артефактов. В кластер ничего не деплоим: ArgoCD
# (Incept10n/inceptech, apps/coffeely) тянет мутабельные теги
# `coffeely-backend:backend` и `coffeely-landing:front` с imagePullPolicy: Always.
#
# Требуемые секреты репозитория:
#   DOCKER_USERNAME, DOCKER_PASSWORD  — Docker Hub (incept1on)
#   S3_ACCESS_KEY, S3_SECRET_KEY      — S3 seaweedfs (https://s3.inceptech.ru)
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD — стабильный ключ подписи APK
#   (иначе обновление поверх установленного приложения невозможно)
#   ADMIN_CRM_SECRET — регистрация сборки в реестре обновлений (без него
#   APK уедет в S3, но приложение не узнает о новой версии)
#
# APK публикуется в бакет `coffeely`: стабильная ссылка /coffeely/coffeely.apk
# (её использует лендинг) + версия с коротким sha в /coffeely/builds/.
# После загрузки сборка регистрируется в API (POST /internal/admin/app-versions):
# GET /app/version отдаёт приложению, есть ли обновление и обязательно ли оно.
# Обязательное (блокирующее) обновление помечается трейлером в сообщении
# коммита: `Force-Update: true`. Отдельная строка «Force-Update» не нужна —
# без неё обновление мягкое, пользователь может отложить.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  S3_ENDPOINT: https://s3.inceptech.ru
  S3_BUCKET: coffeely
  API_BASE_URL: https://coffeely.inceptech.ru/api

jobs:
  backend:
    name: Backend — test, build, push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: coffeely
          POSTGRES_PASSWORD: coffeely
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coffeely"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum

      - name: go vet + тесты (e2e против сервиса postgres)
        working-directory: backend
        env:
          DATABASE_URL: postgres://coffeely:coffeely@localhost:5432/coffeely?sslmode=disable
        run: |
          go vet ./...
          go test ./... -count=1

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Build (и push на main)
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            incept1on/coffeely-backend:backend
            incept1on/coffeely-backend:sha-${{ github.sha }}
          provenance: false

  landing:
    name: Landing — build, push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Build (и push на main)
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ./landing
          file: ./landing/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VITE_YANDEX_TILES_KEY=${{ vars.VITE_YANDEX_TILES_KEY }}
          tags: |
            incept1on/coffeely-landing:front
            incept1on/coffeely-landing:sha-${{ github.sha }}
          provenance: false

  apk:
    name: APK — build, upload to S3
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Полная история: versionCode = git rev-list --count HEAD, иначе на
      # shallow-клоне он всегда 1 и обновление не встанет поверх локальной сборки.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Ключ подписи (стабильный, из секретов)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::нет секрета ANDROID_KEYSTORE_BASE64 — без него APK нельзя обновить поверх установленного"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/coffeely-release.jks"

      - name: Сборка APK (прод-адрес API, release-подпись)
        working-directory: mobile
        env:
          COFFEELY_STORE_FILE: ${{ runner.temp }}/keystore/coffeely-release.jks
          COFFEELY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          COFFEELY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          COFFEELY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # ClientID приложения Яндекс OAuth (не секрет). Задан — в APK
          # появляется кнопка «Войти с Яндексом»; пусто — вход только по паролю.
          COFFEELY_YANDEX_CLIENT_ID: ${{ vars.COFFEELY_YANDEX_CLIENT_ID }}
        run: |
          ./gradlew :composeApp:assembleRelease \
            -Pcoffeely.apiBaseUrl="${API_BASE_URL}" \
            --no-daemon --stacktrace

      - name: Проверка подписи и версии
        run: |
          APK=mobile/composeApp/build/outputs/apk/release/composeApp-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" \
            | grep -E "certificate (DN|SHA-256)"
          # Один и тот же отпечаток обязателен: иначе телефон откажется
          # обновлять установленное приложение (package conflicts with an existing package).
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" \
            | grep -qi "662e4ae3e57414fb52645b362b78bbfb7d2cdb35f6901dedee56f966b84f8c70" \
            || { echo "::error::подпись APK не совпадает с ключом coffeely"; exit 1; }
          # versionCode растёт от коммитов; 1 означает shallow-клона и конфликт версий.
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | head -1
          VERSION_CODE="$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" \
            | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)"
          if [ "${VERSION_CODE:-0}" -le 1 ]; then
            echo "::error::versionCode=$VERSION_CODE — нужна полная история git (fetch-depth: 0)"
            exit 1
          fi

      - name: Подготовка артефакта
        run: |
          mkdir -p dist
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          APK=mobile/composeApp/build/outputs/apk/release/composeApp-release.apk
          cp "$APK" "dist/coffeely-${SHORT_SHA}.apk"
          cp "$APK" dist/coffeely.apk
          ls -la dist

      - name: Upload в S3
        if: github.event_name != 'pull_request'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          aws --endpoint-url "$S3_ENDPOINT" s3 mb "s3://$S3_BUCKET" || true

          # Публичное чтение объектов бакета: APK качают гости с лендинга,
          # без подписи и без ключей. Политика бакета — единственный способ
          # открыть объекты в S3-режиме SeaweedFS.
          cat > /tmp/bucket-policy.json <<'JSON'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "PublicReadApk",
                "Effect": "Allow",
                "Principal": "*",
                "Action": ["s3:GetObject"],
                "Resource": ["arn:aws:s3:::coffeely/*"]
              }
            ]
          }
          JSON

          aws --endpoint-url "$S3_ENDPOINT" s3api put-bucket-policy \
            --bucket "$S3_BUCKET" --policy file:///tmp/bucket-policy.json \
            || echo "::warning::put-bucket-policy не принят — проверь анонимное чтение бакета в SeaweedFS (s3 config / bucket policy)"

          aws --endpoint-url "$S3_ENDPOINT" s3 cp dist/coffeely.apk \
            "s3://$S3_BUCKET/coffeely.apk" \
            --content-type application/vnd.android.package-archive \
            --cache-control "no-cache"
          aws --endpoint-url "$S3_ENDPOINT" s3 cp "dist/coffeely-$(git rev-parse --short=12 HEAD).apk" \
            "s3://$S3_BUCKET/builds/coffeely-$(git rev-parse --short=12 HEAD).apk" \
            --content-type application/vnd.android.package-archive

          # Проверяем, что файл реально отдаётся анонимно (так его качает лендинг).
          curl -fsS -o /dev/null -w "apk http %{http_code}, %{size_download} bytes\n" \
            "$S3_ENDPOINT/$S3_BUCKET/coffeely.apk"

      - name: Регистрация сборки в реестре обновлений
        if: github.event_name != 'pull_request'
        env:
          ADMIN_CRM_SECRET: ${{ secrets.ADMIN_CRM_SECRET }}
        run: |
          APK=dist/coffeely.apk
          VERSION_CODE="$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" \
            | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)"
          VERSION_NAME="$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" \
            | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          SIZE="$(stat -c%s "$APK")"
          # Блокирующее обновление: трейлер в сообщении коммита. Старые версии
          # после релиза увидят непроходимый экран «обновитесь».
          if git log -1 --pretty=%B | grep -qiE '^Force-Update:[[:space:]]*true'; then
            MANDATORY=true
          else
            MANDATORY=false
          fi
          if [ -z "$ADMIN_CRM_SECRET" ]; then
            echo "::warning::секрет ADMIN_CRM_SECRET не задан — версия $VERSION_CODE не попала в реестр обновлений"
            exit 0
          fi
          # jq экранирует changelog: тема коммита попадает в попап «что нового».
          jq -n \
            --arg platform android \
            --argjson version_code "$VERSION_CODE" \
            --arg version_name "$VERSION_NAME" \
            --arg download_url "https://s3.inceptech.ru/coffeely/coffeely.apk" \
            --arg sha256 "$SHA256" \
            --argjson size_bytes "$SIZE" \
            --argjson mandatory "$MANDATORY" \
            --arg changelog "$(git log -1 --pretty=%s)" \
            '{platform: $platform, version_code: $version_code, version_name: $version_name,
              download_url: $download_url, sha256: $sha256, size_bytes: $size_bytes,
              mandatory: $mandatory, changelog: $changelog}' > /tmp/release.json
          cat /tmp/release.json
          # Не валим релиз, если backend ещё не задеплоен с /app/version:
          # APK в S3 уже лежит, пользователи качают его с лендинга.
          curl -fsS -X POST "$API_BASE_URL/internal/admin/app-versions" \
            -H "X-Admin-Secret: $ADMIN_CRM_SECRET" \
            -H "Content-Type: application/json" \
            --data @/tmp/release.json \
            || echo "::warning::сборка не зарегистрирована в API — проверь деплой backend и ADMIN_CRM_SECRET"
